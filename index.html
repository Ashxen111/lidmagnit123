<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Какая сила в вас спит? — тест на архетип реализации</title>
<meta name="description" content="Пройдите тест и узнайте свой архетип реализации: в какой роли вы раскрываетесь на полную и почему сейчас буксуете.">
<meta name="theme-color" content="#0B1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Палитра и базовые настройки ============ */
:root {
  --bg-1: #0B1026;
  --bg-2: #1B1F4B;
  --nebula: 58, 42, 107;          /* #3A2A6B в RGB для прозрачности */
  --gold: #D4AF6A;
  --gold-light: #F3D99B;
  --text: #F5F1E8;
  --muted: #A9ADC8;
  --ink: #1A1530;                 /* тёмный текст на золотых кнопках */
  --glass: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.12);
  --danger: #FFA3A3;

  --r-card: 16px;
  --r-block: 24px;

  --font-head: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background-color: var(--bg-1);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============ Космический фон ============ */
.nebula {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(45% 35% at 15% 12%, rgba(var(--nebula), 0.55), transparent 70%),
    radial-gradient(40% 30% at 90% 65%, rgba(var(--nebula), 0.45), transparent 70%),
    radial-gradient(30% 22% at 65% 8%, rgba(212, 175, 106, 0.07), transparent 70%),
    radial-gradient(35% 25% at 20% 95%, rgba(var(--nebula), 0.35), transparent 70%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
}

#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ============ Контейнер и переходы между экранами ============ */
.app {
  position: relative;
  z-index: 1;
  flex: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 16px 16px;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.app.is-leaving { opacity: 0; transform: translateY(-8px); }
.app.is-entering { opacity: 0; transform: translateY(10px); transition: none; }

.screen {
  display: flex;
  flex-direction: column;
}

.screen-center {
  min-height: calc(100vh - 110px);
  min-height: calc(100dvh - 110px);
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* ============ Типографика ============ */
.eyebrow {
  margin: 0 0 12px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
}

.title {
  margin: 0 0 16px;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: clamp(42px, 12vw, 60px);
  line-height: 1.02;
  background: linear-gradient(180deg, #FFF8E7 20%, var(--gold-light) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.lead {
  margin: 0 0 32px;
  font-size: 17px;
  color: var(--muted);
  max-width: 420px;
}

.hint {
  margin: 14px 0 0;
  font-size: 14px;
  color: var(--muted);
  letter-spacing: 0.02em;
}

[data-focus]:focus { outline: none; }

/* ============ Кнопки ============ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 56px;
  padding: 0 32px;
  border: 0;
  border-radius: 999px;
  font: 600 16px/1.2 var(--font-body);
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease, background 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(212, 175, 106, 0.25);
}
.btn-primary:hover { box-shadow: 0 0 32px rgba(243, 217, 155, 0.5), 0 8px 24px rgba(212, 175, 106, 0.3); }
.btn-primary:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--gold-light);
  border: 1px solid rgba(212, 175, 106, 0.6);
}
.btn-ghost:hover { background: rgba(212, 175, 106, 0.1); box-shadow: 0 0 20px rgba(212, 175, 106, 0.2); }

.btn-block { width: 100%; }
.btn[disabled] { opacity: 0.75; cursor: progress; }

.link {
  align-self: center;
  margin-top: 16px;
  padding: 12px;
  background: none;
  border: 0;
  color: var(--muted);
  font: 500 14px var(--font-body);
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.link:hover { color: var(--text); }

:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }

/* ============ Первый экран ============ */
.emblem {
  width: 132px;
  height: 92px;
  margin-bottom: 20px;
  color: var(--gold-light);
  filter: drop-shadow(0 0 10px rgba(243, 217, 155, 0.45));
}
.emblem svg { width: 100%; height: 100%; }

/* ============ Экран вопроса ============ */
.q-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 44px;
}

.back {
  min-height: 44px;
  padding: 8px 12px 8px 0;
  background: none;
  border: 0;
  color: var(--muted);
  font: 500 15px var(--font-body);
  cursor: pointer;
}
.back:hover { color: var(--text); }

.counter {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gold-light);
}

.progress {
  display: block;
  width: 100%;
  height: auto;
  margin: 10px 0 26px;
  overflow: visible;
}
.progress line { stroke: rgba(255, 255, 255, 0.14); stroke-width: 1; transition: stroke 0.5s ease; }
.progress line.is-lit { stroke: rgba(243, 217, 155, 0.6); }
.pstar path { fill: rgba(255, 255, 255, 0.25); transition: fill 0.4s ease; }
.pstar .halo { fill: rgba(243, 217, 155, 0); stroke: transparent; transition: fill 0.4s ease; }
.pstar.is-current path { fill: #FFFFFF; }
.pstar.is-current .halo { stroke: rgba(243, 217, 155, 0.55); stroke-width: 1; }
.pstar.is-lit path { fill: var(--gold-light); }
.pstar.is-lit .halo { fill: rgba(243, 217, 155, 0.18); }

.q-title {
  margin: 0 0 22px;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: clamp(30px, 8vw, 38px);
  line-height: 1.12;
}

.answers {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.answer {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 60px;
  padding: 14px 18px;
  text-align: left;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-card);
  color: var(--text);
  font: 500 16px/1.4 var(--font-body);
  cursor: pointer;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease, transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
.answer:hover { border-color: rgba(243, 217, 155, 0.4); background: rgba(255, 255, 255, 0.09); }
.answer:active { transform: scale(0.99); }
.answer.is-selected {
  border-color: var(--gold);
  background: rgba(212, 175, 106, 0.12);
  box-shadow: inset 0 0 0 1px var(--gold), 0 0 26px rgba(212, 175, 106, 0.28);
}

.answer-dot {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  transition: border-color 0.2s ease, background 0.2s ease;
}
.answer.is-selected .answer-dot {
  border-color: var(--gold-light);
  background: radial-gradient(circle, var(--gold-light) 0 4px, transparent 5px);
}

.next { align-self: center; margin-top: 24px; }

/* ============ Экран «Считываем ваш код…» ============ */
.loader {
  width: 220px;
  height: 160px;
  margin-bottom: 24px;
  overflow: visible;
}
.loader line {
  stroke: var(--gold-light);
  stroke-width: 1;
  stroke-opacity: 0.7;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  animation: draw 0.45s ease forwards;
  animation-delay: var(--d);
}
.loader .lstar {
  fill: var(--gold-light);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: pop 0.4s ease forwards;
  animation-delay: var(--d);
  filter: drop-shadow(0 0 6px rgba(243, 217, 155, 0.9));
}
.loading-text {
  margin: 0;
  font-family: var(--font-head);
  font-style: italic;
  font-weight: 500;
  font-size: 28px;
  color: var(--gold-light);
  animation: pulse 1.6s ease-in-out infinite;
}

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop {
  0% { opacity: 0; transform: scale(0.2); }
  70% { opacity: 1; transform: scale(1.3); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes pulse { 50% { opacity: 0.55; } }

/* ============ Экран результата ============ */
.result {
  align-items: center;
  text-align: center;
  padding-top: 8px;
}

.result-symbol {
  width: 116px;
  height: 116px;
  margin: 4px auto 8px;
  color: var(--accent);
  filter: drop-shadow(0 0 12px var(--accent));
  animation: glow 3.2s ease-in-out infinite alternate;
}
.result-symbol svg { width: 100%; height: 100%; }

@keyframes glow {
  from { filter: drop-shadow(0 0 6px var(--accent)); }
  to { filter: drop-shadow(0 0 20px var(--accent)); }
}

.result-name {
  margin: 0 0 10px;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: clamp(46px, 13vw, 64px);
  line-height: 1;
  color: var(--text);
  text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
}

.result-lead {
  margin: 0 0 24px;
  font-size: 18px;
  max-width: 440px;
}

.result-card {
  width: 100%;
  margin: 0;
  padding: 6px 20px;
  text-align: left;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-top: 2px solid var(--accent);
  border-radius: var(--r-block);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.result-card > div { padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
.result-card > div:last-child { border-bottom: 0; }
.result-card dt {
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.result-card dd { margin: 0; }

.bridge {
  margin: 32px 0 20px;
  font-family: var(--font-head);
  font-weight: 500;
  font-size: 22px;
  line-height: 1.35;
}
.bridge em { color: var(--gold-light); font-style: italic; }

/* ============ Форма ============ */
.lead-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 26px 20px 22px;
  text-align: left;
  background: rgba(11, 16, 38, 0.6);
  border: 1px solid rgba(212, 175, 106, 0.4);
  border-radius: var(--r-block);
  box-shadow: 0 0 44px rgba(212, 175, 106, 0.1);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.form-title {
  margin: 0 0 2px;
  font-family: var(--font-head);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.1;
  text-align: center;
  color: var(--gold-light);
}

.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
fieldset.field { margin: 0; padding: 0; border: 0; }

.label {
  padding: 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.input {
  width: 100%;
  min-height: 52px;
  padding: 0 16px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  color: var(--text);
  font: 500 16px var(--font-body);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  -webkit-appearance: none;
  appearance: none;
}
.input::placeholder { color: rgba(169, 173, 200, 0.7); }
.input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 106, 0.22); }
.field.has-error .input { border-color: var(--danger); }

.error { margin: 0; font-size: 13px; color: var(--danger); }
.error:empty { display: none; }

.pills { display: flex; gap: 8px; }
.pill { position: relative; flex: 1 1 0; min-width: 0; }
.pill input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.pill span {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 8px;
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 15px;
  font-weight: 600;
  transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.25s ease, color 0.2s ease;
}
.pill input:hover + span { border-color: rgba(243, 217, 155, 0.4); }
.pill input:checked + span {
  border-color: var(--gold);
  background: rgba(212, 175, 106, 0.16);
  color: var(--gold-light);
  box-shadow: 0 0 18px rgba(212, 175, 106, 0.22);
}
.pill input:focus-visible + span { outline: 2px solid var(--gold-light); outline-offset: 2px; }
.field.has-error .pill span { border-color: rgba(255, 163, 163, 0.6); }

.check {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  line-height: 1.45;
  color: var(--muted);
  cursor: pointer;
}
.check input {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin: 0;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}
.check input:checked { background: var(--gold); border-color: var(--gold); }
.check input:checked::after {
  content: "";
  width: 6px;
  height: 11px;
  border: solid var(--ink);
  border-width: 0 2px 2px 0;
  transform: translateY(-1px) rotate(45deg);
}
.check a { color: var(--gold-light); }
.field.has-error .check input { border-color: var(--danger); }

.form-status { margin: 0; font-size: 14px; color: var(--danger); text-align: center; }
.form-status:empty { display: none; }

.spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(26, 21, 48, 0.25);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ Экран благодарности ============ */
.thanks-symbol {
  width: 88px;
  height: 88px;
  margin-bottom: 20px;
  color: var(--gold-light);
  filter: drop-shadow(0 0 14px rgba(243, 217, 155, 0.6));
}
.thanks-symbol svg { width: 100%; height: 100%; }
.thanks .title { font-size: clamp(38px, 10vw, 52px); }
.thanks p { margin: 0 0 16px; max-width: 420px; font-size: 17px; }
.thanks .muted { color: var(--muted); font-size: 16px; }
.thanks .btn { margin-top: 12px; }

/* ============ Подвал ============ */
.disclaimer {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 16px max(16px, env(safe-area-inset-bottom));
  font-size: 12px;
  text-align: center;
  color: rgba(169, 173, 200, 0.7);
}

/* ============ Десктоп ============ */
@media (min-width: 768px) {
  .app { padding-top: 48px; }
  .lead-form { padding: 32px 32px 26px; }
}

/* ============ Без анимаций для тех, кто их отключил ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>
<body>
  <div class="nebula" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main id="app" class="app"></main>

  <footer class="disclaimer">
    Тест носит ознакомительный характер и не является психологической диагностикой.
  </footer>

  <script>
/*
 * НАСТРОЙКИ И ТЕКСТЫ ЛИД-МАГНИТА
 * Здесь можно менять тексты, вопросы, архетипы и ссылки — без правки остального кода.
 * Важно: тексты стоят в кавычках "…". Если внутри текста нужны кавычки — используйте «ёлочки».
 */
window.LEAD_CONFIG = {
  // Ссылка на ваш канал/соцсеть. Пока пусто — кнопка «Перейти в канал» не показывается.
  channelUrl: "",

  // Ссылка на политику конфиденциальности.
  privacyUrl: "#",

  // Срок, за который вы присылаете расшифровку (подставляется во фразу «в течение …»).
  replyTime: "24 часов",

  // Адрес серверной функции для отправки заявок (например, "/api/lead").
  // Пока пусто — отправка имитируется, заявка выводится в консоль браузера. См. README.
  leadEndpoint: "/.netlify/functions/lead",

  // Ключ для сохранения прогресса в браузере. Поменяйте, если сильно меняете вопросы.
  storageKey: "archetype-test-v1",

  intro: {
    eyebrow: "Тест на архетип реализации",
    title: "Какая сила в&nbsp;вас&nbsp;спит?",
    subtitle:
      "Пройдите тест и узнайте свой архетип реализации: в какой роли вы раскрываетесь на полную и почему сейчас буксуете.",
    button: "Узнать свой архетип",
    hint: "9 вопросов · 2 минуты · бесплатно"
  },

  loadingText: "Считываем ваш код…",

  resultEyebrow: "Ваш архетип реализации",

  bridgeText:
    "Архетип показывает, <em>как</em> вы раскрываетесь. А <em>ради чего</em> вы пришли в этот мир и что именно сейчас тормозит ваш рост, зашифровано в вашей дате рождения. Оставьте дату рождения, и я пришлю вам личную расшифровку: что ваш архетип значит конкретно для вас.",

  form: {
    title: "Получите личную расшифровку",
    button: "Получить расшифровку",
    consent: "Я согласна на обработку персональных данных",
    privacyLinkText: "Политика конфиденциальности"
  },

  messengers: [
    { id: "telegram", label: "Telegram", contactLabel: "Ваш Telegram", placeholder: "@username или номер телефона" },
    { id: "whatsapp", label: "WhatsApp", contactLabel: "Номер WhatsApp", placeholder: "Номер телефона" },
    { id: "max", label: "Max", contactLabel: "Номер в Max", placeholder: "Номер телефона" }
  ],

  thanks: {
    title: "Спасибо, {name}! ✨",
    text: "Ваша личная расшифровка уже в работе. Пришлю её в {messenger} в течение {time}.",
    channelText: "А пока подпишитесь на мой канал — там много о том, как цифры влияют на реализацию.",
    channelButton: "Перейти в канал"
  },

  restartText: "Пройти тест заново",

  archetypes: {
    A: {
      name: "Вдохновительница",
      symbol: "burst",
      color: "#F2A65A",
      text: "Вы созданы для масштаба и влияния — люди загораются рядом с вами.",
      superpower: "Зажигать других и вести за собой.",
      blocker: "Вы играете роль «поменьше», чем вам на самом деле по силам.",
      step: "Перестаньте ждать разрешения и заявите о себе громче."
    },
    B: {

  <script>
/*
 * Подсчёт результата теста.
 * keys    — массив выбранных архетипов по вопросам, например ["A","B",...].
 * weights — массив весов вопросов (по умолчанию 1).
 * Побеждает архетип с наибольшей суммой. При равенстве — тот из лидеров,
 * который выбран в последнем вопросе; если там не лидер — в предпоследнем и т.д.
 */
(function (root) {
  function computeResult(keys, weights) {
    var scores = { A: 0, B: 0, C: 0, D: 0 };
    keys.forEach(function (k, i) {
      scores[k] += (weights && weights[i]) || 1;
    });
    var max = Math.max.apply(null, Object.keys(scores).map(function (k) { return scores[k]; }));
    var leaders = Object.keys(scores).filter(function (k) { return scores[k] === max; });
    var winner = leaders[0];
    if (leaders.length > 1) {
      for (var i = keys.length - 1; i >= 0; i--) {
        if (leaders.indexOf(keys[i]) !== -1) { winner = keys[i]; break; }
      }
    }
    return { scores: scores, winner: winner };
  }

  if (typeof module !== "undefined" && module.exports) module.exports = { computeResult: computeResult };
  else root.computeResult = computeResult;
})(this);

              (m ? m.placeholder : "Сначала выберите мессенджер") + '">' +
            '<p class="error" id="e-contact" aria-live="polite"></p>' +
          "</div>" +

          '<div class="field" data-field="consent">' +
            '<label class="check"><input type="checkbox" name="consent"' + (f.consent ? " checked" : "") + ' aria-describedby="e-consent">' +
              "<span>" + CFG.form.consent + ' (<a href="' + CFG.privacyUrl + '" target="_blank" rel="noopener">' + CFG.form.privacyLinkText.toLowerCase() + "</a>)</span>" +
            "</label>" +
            '<p class="error" id="e-consent" aria-live="polite"></p>' +
          "</div>" +

          '<p class="form-status" role="alert"></p>' +
          '<button type="submit" class="btn btn-primary btn-block">' + CFG.form.button + "</button>" +
        "</form>" +

        '<button type="button" class="link" data-action="restart">' + CFG.restartText + "</button>" +
      "</section>";

    // Значения, введённые пользователем, вставляем как значения полей (не как HTML)
    var form = app.querySelector(".lead-form");
    form.elements.name.value = f.name || "";
    form.elements.dob.value = f.dob || "";
    form.elements.contact.value = f.contact || "";
    updateContactField(form);
  }

  function renderThanks() {
    var name = lastSent ? lastSent.name : "";
    var mLabel = lastSent ? lastSent.messengerLabel : "";
    var hasChannel = !!CFG.channelUrl;

    app.innerHTML =
      '<section class="screen screen-center thanks">' +
        '<div class="thanks-symbol">' + SYMBOLS.sparkle + "</div>" +
        '<h1 class="title" tabindex="-1" data-focus></h1>' +
        '<p class="thanks-text"></p>' +
        (hasChannel
          ? '<p class="muted">' + CFG.thanks.channelText + "</p>" +
            '<a class="btn btn-primary" target="_blank" rel="noopener" href="' + CFG.channelUrl + '">' + CFG.thanks.channelButton + "</a>"
          : "") +
        '<button type="button" class="link" data-action="restart">' + CFG.restartText + "</button>" +
      "</section>";

    app.querySelector(".title").textContent = CFG.thanks.title.replace("{name}", name).replace(/,\s*!/, "!");
    app.querySelector(".thanks-text").textContent = CFG.thanks.text
      .replace("{messenger}", mLabel)
      .replace("{time}", CFG.replyTime);
  }

  /* ===================== Действия ===================== */
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el || busy) return;
    var action = el.getAttribute("data-action");

    if (action === "start") {
      if (!state.startedAt) state.startedAt = new Date().toISOString();
      state.current = 0;
      go("question");
    } else if (action === "answer") {
      onAnswer(el);
    } else if (action === "next") {
      advance();
    } else if (action === "back") {
      if (state.current === 0) go("intro");
      else { state.current--; go("question"); }
    } else if (action === "restart") {
      state = freshState();
      lastSent = null;
      store.clear();
      go("intro");
    }
  });

  function onAnswer(btn) {
    if (busy) return;
    busy = true;
    var i = state.current;
    state.answers[i] = btn.getAttribute("data-key");
    save();

    app.querySelectorAll(".answer").forEach(function (b) {
      var on = b === btn;
      b.classList.toggle("is-selected", on);
      b.setAttribute("aria-checked", String(on));
    });
    var star = app.querySelector('[data-star="' + i + '"]');
    if (star) star.classList.add("is-lit");
    var lineBefore = app.querySelector('[data-line="' + i + '"]');
    if (lineBefore && state.answers[i - 1]) lineBefore.classList.add("is-lit");
    var lineAfter = app.querySelector('[data-line="' + (i + 1) + '"]');
    if (lineAfter && state.answers[i + 1]) lineAfter.classList.add("is-lit");

    setTimeout(function () { busy = false; advance(); }, reduceMotion ? 150 : 400);
  }

  function advance() {
    if (!state.answers[state.current]) return;
    if (state.current < TOTAL - 1) { state.current++; go("question"); }
    else go("loading");
  }

  /* ===================== Форма ===================== */
  function messengerById(id) {
    for (var i = 0; i < CFG.messengers.length; i++) if (CFG.messengers[i].id === id) return CFG.messengers[i];
    return null;
  }

  function updateContactField(form) {
    var m = messengerById(state.form.messenger);
    var input = form.elements.contact;
    document.getElementById("l-contact").textContent = m ? m.contactLabel : "Контакт";
    input.placeholder = m ? m.placeholder : "Сначала выберите мессенджер";
    input.setAttribute("inputmode", m && m.id !== "telegram" ? "tel" : "text");
    input.setAttribute("autocomplete", m && m.id !== "telegram" ? "tel" : "off");
  }

  function formatDob(value) {
    var d = value.replace(/\D/g, "").slice(0, 8);
    if (d.length > 4) return d.slice(0, 2) + "." + d.slice(2, 4) + "." + d.slice(4);
    if (d.length > 2) return d.slice(0, 2) + "." + d.slice(2);
    return d;
  }

  function validDob(str) {
    var m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(str);
    if (!m) return "Введите дату в формате ДД.ММ.ГГГГ";
    var day = +m[1], mon = +m[2], year = +m[3];
    var dt = new Date(year, mon - 1, day);
    if (dt.getFullYear() !== year || dt.getMonth() !== mon - 1 || dt.getDate() !== day) return "Такой даты не существует — проверьте, пожалуйста";
    if (year < 1900) return "Проверьте год рождения";
    if (dt > new Date()) return "Дата рождения не может быть в будущем";
    return "";
  }

  function digits(s) { return s.replace(/\D/g, ""); }

  function validContact(messenger, value) {
    var v = value.trim();
    if (!messenger) return "Сначала выберите мессенджер";
    if (!v) return "Укажите, куда прислать расшифровку";
    var phoneOk = /^[+\d\s()\-]+$/.test(v) && digits(v).length >= 10 && digits(v).length <= 15;
    if (messenger === "telegram") {
      var userOk = /^@?[A-Za-z0-9_]{5,32}$/.test(v) && /[A-Za-z]/.test(v);
      if (userOk || phoneOk) return "";
      return "Укажите @username или номер телефона";
    }
    return phoneOk ? "" : "Укажите номер телефона, например +7 900 123-45-67";
  }

  function validateForm(f) {
    var errors = {};
    if (f.name.trim().length < 2) errors.name = "Напишите, как к вам обращаться";
    var dobErr = validDob(f.dob);
    if (dobErr) errors.dob = dobErr;
    if (!f.messenger) errors.messenger = "Выберите мессенджер";
    var cErr = validContact(f.messenger, f.contact);
    if (cErr && f.messenger) errors.contact = cErr;
    if (!f.consent) errors.consent = "Нужно согласие, чтобы я могла прислать расшифровку";
    return errors;
  }

  function setError(form, field, msg) {
    var wrap = form.querySelector('[data-field="' + field + '"]');
    if (!wrap) return;
    wrap.classList.toggle("has-error", !!msg);
    wrap.querySelector(".error").textContent = msg || "";
    var input = wrap.querySelector("input");
    if (input && field !== "messenger") input.setAttribute("aria-invalid", msg ? "true" : "false");
  }

  app.addEventListener("input", function (e) {
    var form = e.target.form;
    if (!form || !form.classList.contains("lead-form")) return;
    var name = e.target.name;

    if (name === "dob") {
      var before = e.target.value;
      var formatted = formatDob(before);
      if (formatted !== before) e.target.value = formatted;
    }
    if (name === "consent") state.form.consent = e.target.checked;
    else if (name === "messenger") {
      state.form.messenger = e.target.value;
      updateContactField(form);
      setError(form, "messenger", "");
    } else if (name in state.form) state.form[name] = e.target.value;

    if (name !== "messenger") setError(form, name, "");
    save();
  });

  app.addEventListener("change", function (e) {
    if (e.target.name === "consent" && e.target.form) {
      state.form.consent = e.target.checked;
      setError(e.target.form, "consent", "");
      save();
    }
  });

  app.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form.classList.contains("lead-form")) return;
    e.preventDefault();
    if (busy) return;

    var f = {
      name: form.elements.name.value,
      dob: form.elements.dob.value,
      messenger: state.form.messenger,
      contact: form.elements.contact.value,
      consent: form.elements.consent.checked
    };
    var errors = validateForm(f);
    ["name", "dob", "messenger", "contact", "consent"].forEach(function (k) { setError(form, k, errors[k]); });
    var status = form.querySelector(".form-status");
    status.textContent = "";

    var firstBad = ["name", "dob", "messenger", "contact", "consent"].filter(function (k) { return errors[k]; })[0];
    if (firstBad) {
      var target = form.querySelector('[data-field="' + firstBad + '"] input');
      if (target) target.focus();
      return;
    }

    var btn = form.querySelector('button[type="submit"]');
    busy = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Отправляем…';

    var lead = buildLead(f);
    sendLead(lead).then(function () {
      busy = false;
      lastSent = { name: f.name.trim(), messengerLabel: messengerById(f.messenger).label };
      store.clear();
      state.screen = "thanks";
      transition(render);
    }).catch(function (err) {
      console.error(err);
      busy = false;
      btn.disabled = false;
      btn.textContent = CFG.form.button;
      status.textContent = "Не получилось отправить заявку. Проверьте интернет и попробуйте ещё раз.";
    });
  });

  function buildLead(f) {
    var res = getResult();
    var scores = {};
    Object.keys(res.scores).forEach(function (k) { scores[CFG.archetypes[k].name] = res.scores[k]; });

    return {
      id: state.id,
      createdAt: new Date().toISOString(),
      startedAt: state.startedAt,
      name: f.name.trim(),
      birthDate: f.dob,
      messenger: messengerById(f.messenger).label,
      contact: f.contact.trim(),
      consent: true,
      answers: CFG.questions.map(function (q, i) {
        var key = state.answers[i];
        var ans = q.answers.filter(function (a) { return a.key === key; })[0];
        return { question: q.text, answer: ans ? ans.text : "", archetype: CFG.archetypes[key].name };
      }),
      scores: scores,
      result: CFG.archetypes[res.winner].name,
      utm: state.utm || {},
      page: location.href.split("#")[0]
    };
  }

  /* ===================== Звёздное небо ===================== */
  (function sky() {
    var canvas = document.getElementById("sky");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    var stars = [], w = 0, h = 0, lastW = 0, lastH = 0, last = 0, rafId = null;

    function build() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      canvas.style.width = w + "px"; canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (w !== lastW || Math.abs(h - lastH) > 150 || !stars.length) {
        var n = Math.round(Math.min(120, Math.max(50, (w * h) / 8000)));
        stars = [];
        for (var i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * w, y: Math.random() * h,
            r: Math.random() * 1.1 + 0.3,
            a: Math.random() * 0.55 + 0.25,
            s: Math.random() * 0.9 + 0.3,
            p: Math.random() * Math.PI * 2,
            gold: Math.random() < 0.18
          });
        }
        lastW = w; lastH = h;
      }
      draw(performance.now());
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = reduceMotion ? 1 : 0.55 + 0.45 * Math.sin((t / 1000) * s.s + s.p);
        ctx.globalAlpha = s.a * tw;
        ctx.fillStyle = s.gold ? "#F3D99B" : "#FFFFFF";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function loop(t) {
      if (t - last > 40) { draw(t); last = t; } // ~25 кадров в секунду — бережём батарею
      rafId = requestAnimationFrame(loop);
    }

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(build, 150);
    });
    document.addEventListener("visibilitychange", function () {
      if (reduceMotion) return;
      if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
      else if (!rafId) rafId = requestAnimationFrame(loop);
    });

    build();
    if (!reduceMotion) rafId = requestAnimationFrame(loop);
  })();

  render();
})();

</script>
</body>
</html>
